# ==================================================
# Production Nginx Reverse Proxy Configuration
# ==================================================
# Serves static assets directly, proxies dynamic HTTP
# requests to Gunicorn WSGI server, and handles SSL.
# ==================================================

upstream flask_app {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name shopanalytica.com www.shopanalytica.com;

    # Redirect all HTTP traffic to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shopanalytica.com www.shopanalytica.com;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/shopanalytica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopanalytica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Max upload size (for product images)
    client_max_body_size 16M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # Serve static assets directly via Nginx for speed
    location /static/ {
        alias /var/www/shopanalytica/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy dynamic requests to Gunicorn WSGI Server
    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
