{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-75">
    <div class="text-center animate-fade-in-up">
        <div style="font-size: 8rem; font-weight: 800; background: var(--sa-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; letter-spacing: -0.05em;">
            404
        </div>
        <h2 class="fw-700 mb-3">Page Not Found</h2>
        <p class="text-muted mb-4" style="max-width: 400px; margin: 0 auto;">
            Sorry, the page you're looking for doesn't exist or has been moved.
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-primary-custom">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
            <button onclick="history.back()" class="btn btn-outline-custom">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
