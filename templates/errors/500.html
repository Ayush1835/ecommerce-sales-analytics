{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-75">
    <div class="text-center animate-fade-in-up">
        <div style="font-size: 8rem; font-weight: 800; background: linear-gradient(135deg, #EF4444, #DC2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; letter-spacing: -0.05em;">
            500
        </div>
        <h2 class="fw-700 mb-3">Something Went Wrong</h2>
        <p class="text-muted mb-4" style="max-width: 400px; margin: 0 auto;">
            We encountered an internal error. Please try again later or contact support if the issue persists.
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-primary-custom">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
            <button onclick="location.reload()" class="btn btn-outline-custom">
                <i class="bi bi-arrow-clockwise me-2"></i>Retry
            </button>
        </div>
    </div>
</div>
{% endblock %}
